<div class="container" style="padding: 20px; font-family: sans-serif;">
  
  <h1>Secret Vault 🔒</h1>

  @if (user$ | async; as user) {
    <div>
      <p>Welcome, <strong>{{ user.displayName }}</strong></p>
      <button (click)="logout()">Logout</button>

      <hr>

      <h3>Take & Upload Private Photo</h3>
      <input type="file" (change)="uploadFile($event, user)" accept="image/*" capture="environment">

      @if (uploadProgress$ | async; as pct) {
        <div>
          <progress [value]="pct" max="100"></progress>
          <span>{{ pct | number:'1.0-0' }}%</span>
        </div>
      }

      @if (uploadState) {
        <p>{{ uploadState }}</p>
      }
    </div>
  } @else {
    <p>You must login to access your private folder.</p>
    <button (click)="login()">Login with Google</button>
  }

</div>
