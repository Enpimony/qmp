<div class="min-h-screen bg-base-200 flex items-center justify-center p-4">
  <div class="card w-full max-w-lg bg-base-100 shadow-xl">
    <div class="card-body">
      <h1 class="card-title text-3xl font-bold text-center mb-6">Secret Vault 🔒</h1>

      @if (user$ | async; as user) {
      <div class="space-y-4">
        <div class="alert alert-success">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="stroke-current shrink-0 h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <span
            >Welcome, <strong>{{ user.displayName }}</strong></span
          >
        </div>

        <button class="btn btn-outline btn-error w-full" (click)="logout()">Logout</button>

        <div class="divider">Upload Section</div>

        <h3 class="text-xl font-semibold">Take & Upload Private Photo</h3>
        <input
          type="file"
          class="file-input file-input-bordered w-full"
          (change)="uploadFile($event, user)"
          accept="image/*"
          capture="environment"
        />

        @if (uploadProgress$ | async; as pct) {
        <div class="space-y-2">
          <progress class="progress progress-primary w-full" [value]="pct" max="100"></progress>
          <span class="text-sm">{{ pct | number : '1.0-0' }}%</span>
        </div>
        } @if (uploadState) {
        <div class="alert alert-info">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="stroke-current shrink-0 h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
            />
          </svg>
          <span>{{ uploadState }}</span>
        </div>
        }
      </div>
      } @else {
      <div class="text-center space-y-4">
        <div class="alert alert-warning">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="stroke-current shrink-0 h-6 w-6"
            fill="none"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L3.732 16.5c-.77.833.192 2.5 1.732 2.5z"
            />
          </svg>
          <span>You must login to access your private folder.</span>
        </div>
        <button class="btn btn-primary btn-lg w-full" (click)="login()">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 mr-2"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"
            />
          </svg>
          Login with Google
        </button>
      </div>
      }
    </div>
  </div>
</div>
